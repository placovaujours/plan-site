<style>
/* Layout: blue header · zone picker · zoomable aerial map · zone sheet · site rules. 360° viewer as full-screen overlay. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --fg:#1A1F26; --muted:#5A6470; --line:#D3D9E0;
  --brand:#005EB8; --brand-fg:#FFFFFF; --mark:#FFD400; --mapbg:#2B3138; --note-bg:#FFF4C2; --note-fg:#4A3A00;
  --display:'Source Sans 3','Arial Narrow',Arial,sans-serif;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161C;--surface:#1A222B;--fg:#E8EDF2;--muted:#9AA6B3;--line:#2C3743;--brand:#0B6BC9;--note-bg:#3A3210;--note-fg:#F3E6A8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161C;--surface:#1A222B;--fg:#E8EDF2;--muted:#9AA6B3;--line:#2C3743;--brand:#0B6BC9;--note-bg:#3A3210;--note-fg:#F3E6A8;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}

/* Small 3D figure drawn with plain WebGL (no library): a mannequin that puts on each item as it is tapped, with a camera zoom. */
function Figure(el){const im=el.querySelector('img');if(!im)return null;
  /* areas of the 1024 x 1536 photo: [left, top, width, height] */
  const R={full:[0,0,1024,1536],helmet:[362,0,300,262],vest:[296,222,432,520],shoes:[262,1338,500,198],gloves:[236,686,552,214]};let cur='full';
  function lay(){const w=el.clientWidth,h=el.clientHeight,r=R[cur];if(!w||!h)return;const s=Math.min(w/r[2],h/r[3]);
    im.style.transform='translate('+((w-r[2]*s)/2-r[0]*s).toFixed(1)+'px,'+((h-r[3]*s)/2-r[1]*s).toFixed(1)+'px) scale('+s.toFixed(4)+')'}
  if('ResizeObserver' in window)new ResizeObserver(lay).observe(el);else window.addEventListener('resize',lay);
  return{start:lay,stop(){},show(g){cur=g;lay()},full(){cur='full';lay()}}
}
const ob=$('ob'),seen=new Set();let fig=null,obCur=-1,obTimer=0;
function obLabel(){const l=$('ob-label');l.hidden=obCur<0;if(obCur>=0)l.textContent=L('e'+obCur);
  document.querySelectorAll('#ob-epi button').forEach((b,i)=>{b.querySelector('span').textContent=L('e'+i)})}
function obPick(i){obCur=i;seen.add(i);clearTimeout(obTimer);
  document.querySelectorAll('#ob-epi button').forEach((b,j)=>{b.setAttribute('aria-pressed',j===i?'true':'false');if(seen.has(j))b.classList.add('done')});
  $('ob-prog').textContent=seen.size+' / 4';obLabel();
  if(fig)fig.show(GRP[i]);else{const f=$('ob-fb');f.hidden=false;f.innerHTML=EPI[i]}
  if(seen.size===4){const go=$('ob-go');if(go.hidden){go.hidden=false;go.scrollIntoView({block:'nearest'})}
    obTimer=setTimeout(()=>{if(fig)fig.full();obCur=-1;obLabel();document.querySelectorAll('#ob-epi button').forEach(b=>b.setAttribute('aria-pressed','false'))},2600)}}
function obIntro(){const st=ob.querySelector('.ob-stop'),lg=ob.querySelector('.ob-logo');if(!st)return;ob.classList.add('intro');
  const r=st.getBoundingClientRect(),k=Math.min(1.75,(innerWidth-40)/r.width),dx=innerWidth/2-(r.left+r.width/2),dy=innerHeight/2-(r.top+r.height/2);
  st.style.transition='none';st.style.transform=`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${k.toFixed(3)})`;
  /* the logo first sits centred just above the enlarged warning, then goes back to the top of the page with it */
  if(lg){const im=lg.querySelector('img').getBoundingClientRect(),kl=2,ly=innerHeight/2-r.height*k/2-26-im.height*kl/2;
    lg.style.transition='none';lg.style.transform=`translate(${(innerWidth/2-(im.left+im.width/2)).toFixed(1)}px,${(ly-(im.top+im.height/2)).toFixed(1)}px) scale(${kl})`}
  void st.offsetWidth;st.style.transition='';if(lg)lg.style.transition='';
  let done=false;const end=()=>{if(done)return;done=true;clearTimeout(t);ob.classList.remove('intro');st.style.transform='';if(lg)lg.style.transform='';ob.removeEventListener('pointerdown',end)};
  const t=setTimeout(end,2300);ob.addEventListener('pointerdown',end)}
function obOpen(){obIntro();EPI.forEach((svg,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML=svg+'<span></span>';b.onclick=()=>obPick(i);$('ob-epi').appendChild(b)});
  try{fig=Figure($('ob-cv'))}catch(e){fig=null}if(fig)fig.start();else $('ob-cv').hidden=true;
  document.querySelectorAll('header,.note,main,footer').forEach(e=>{e.inert=true;e.setAttribute('aria-hidden','true')});document.documentElement.style.overflow='hidden';
  $('lang2').onchange=e=>{lang=e.target.value;try{localStorage.setItem('plan-lang',lang)}catch(_){}applyLang()};
  $('ob-go').onclick=()=>{clearTimeout(obTimer);if(fig)fig.stop();ob.hidden=true;document.documentElement.style.overflow='';
    document.querySelectorAll('header,.note,main,footer').forEach(e=>{e.inert=false;e.removeAttribute('aria-hidden')});fit(target,false);$('chips').querySelector('button').focus({preventScroll:true})}}
